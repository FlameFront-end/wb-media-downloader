name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  checks:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Lint architecture
        run: npm run lint:arch

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          summary=apps/web/coverage/coverage-summary.json
          if [ -f "$summary" ]; then
            node -e '
              const total = require(process.argv[1]).total
              const rows = ["lines", "statements", "functions", "branches"].map(k => `| ${k} | ${total[k].pct}% |`)
              console.log(["### Coverage (web)", "", "| Metric | Coverage |", "| --- | --- |", ...rows].join("\n"))
            ' "$PWD/$summary" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-web
          path: apps/web/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-web
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7
